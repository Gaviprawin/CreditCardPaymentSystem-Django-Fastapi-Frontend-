{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{% block title %}PaySecure{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{% static 'frontend/css/style.css' %}"
    >

</head>

<body>

    <div class="app-layout">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">

            <div class="brand">
                <div class="brand-icon">
                    $
                </div>

                <div>
                    <h2>PaySecure</h2>
                    <span>Payment System</span>
                </div>
            </div>

            <nav class="sidebar-nav">

                <a
                    href="/dashboard/"
                    class="nav-link"
                >
                    <span>⌂</span>
                    Dashboard
                </a>

                <a
                    href="/cards/"
                    class="nav-link"
                >
                    <span>▣</span>
                    My Cards
                </a>

                <a
                    href="/payment/"
                    class="nav-link"
                >
                    <span>↗</span>
                    Make Payment
                </a>

                <a
                    href="/transactions/"
                    class="nav-link"
                >
                    <span>▤</span>
                    Transactions
                </a>

                <a href="/admin-summary/" class="nav-link">
                        <span>▥</span>
                        Admin Summary
                    </a>

            </nav>

            <div class="sidebar-bottom">

                <button
                    class="logout-button"
                    onclick="logoutUser()"
                >
                    <span>↪</span>
                    Logout
                </button>

            </div>

        </aside>

        <!-- Main content -->
        <main class="main-content">

            <header class="topbar">

                <button
                    class="menu-button"
                    onclick="toggleSidebar()"
                >
                    ☰
                </button>

                <div class="topbar-title">
                    {% block page_title %}
                    Dashboard
                    {% endblock %}
                </div>

                <div class="user-area">

                    <div class="user-avatar">
                        U
                    </div>

                    <div>
                        <strong id="topUsername">
                            User
                        </strong>

                        <small>
                            Account
                        </small>
                    </div>

                </div>

            </header>

            <section class="page-container">

                {% block content %}
                {% endblock %}

            </section>

        </main>

    </div>

    <!-- Toast -->
    <div
        id="toast"
        class="toast"
    ></div>

    <script src="{% static 'frontend/js/app.js' %}"></script>

    {% block scripts %}
    {% endblock %}

</body>
</html>
